[pytest]
# asyncio_mode = auto: all async def test_* functions run automatically without
# needing @pytest.mark.asyncio on every single test.
asyncio_mode = auto

# Share one event loop across the entire test session.
# Why: SQLAlchemy's asyncpg engine is bound to the first event loop at import
# time. If pytest-asyncio creates a new loop per test (the default), DB
# connections become invalid mid-suite with "Future attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Add project root to PYTHONPATH so "from app.xxx import yyy" works in tests.
pythonpath = .

# Only look for tests inside the tests/ directory.
testpaths = tests
